name: Firmware CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: gamebox workspace
    steps:
      - uses: actions/checkout@v7
        with:
          path: gamebox workspace
          persist-credentials: false
      # rustup reads the pinned version, target, and components from the repo.
      # The checkout path also exercises spaces in every build/artifact path.
      - name: Check, test, build, and verify artifacts
        run: cargo xtask ci
