name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gcc-arm-none-eabi ninja-build

      - name: Build and test
        shell: pwsh
        run: ./scripts/verify.ps1

      - name: Run GCC static analyzer
        run: |
          cmake --preset Analyze
          cmake --build --preset Analyze

      - name: Upload firmware and OLED preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stm32-gamebox-build
          path: |
            build/Release/stm32103c8t6_game-box.elf
            build/Release/stm32103c8t6_game-box.hex
            build/Release/stm32103c8t6_game-box.bin
            build/HostTests/oled_menu_preview.bmp
          if-no-files-found: error
          retention-days: 14
