[workspace]
members = ["crates/gamebox-core", "crates/oled-driver", "firmware", "tools/font-subset"]
default-members = ["firmware"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "MIT"
publish = false

[workspace.dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
defmt = "1.0.1"
defmt-rtt = "1.0.0"
embassy-executor = { version = "0.10.0", features = ["defmt", "executor-thread", "platform-cortex-m"] }
embassy-futures = "0.1.2"
embassy-stm32 = { version = "0.6.0", features = ["defmt", "stm32f103c8", "time-driver-any", "unstable-pac"] }
embassy-sync = { version = "0.8.0", features = ["defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt"] }
gamebox-core = { path = "crates/gamebox-core" }
oled-driver = { path = "crates/oled-driver", default-features = false }
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
static_cell = "2"

[profile.dev]
debug = 2
opt-level = 1

[profile.release]
codegen-units = 1
debug = 1
incremental = false
lto = "fat"
opt-level = "z"
# The firmware's time/coordinate arithmetic uses explicit wrapping,
# saturating, and checked operations where rollover matters. Keep the normal
# embedded release policy here; global checks cost several KiB on Cortex-M3.
overflow-checks = false

[profile.test]
opt-level = 2
