[package]
name = "oled-driver"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Layered no_std OLED driver with SSD1306, buffered and paged rendering"
readme = "README.md"

[features]
default = ["blocking", "graphics"]
blocking = ["dep:embedded-hal"]
async = ["dep:embedded-hal", "dep:embedded-hal-async"]
graphics = ["dep:embedded-graphics-core"]

[dependencies]
embedded-graphics-core = { version = "0.4.0", optional = true }
embedded-hal = { version = "1.0.0", optional = true }
embedded-hal-async = { version = "1.0.0", optional = true }
